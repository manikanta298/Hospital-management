# Build the React app first (cd frontend && npm install && npm run build), then:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: icthospital, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/icthospital
      SESSION_SECRET: change-me-to-a-long-random-string
      OTP: "No"
    ports: ["8000:8000"]
    volumes: [uploads:/app/backend/uploads]
volumes: { pgdata: {}, uploads: {} }
